[workspace]
members = ["crates/*", "codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naughie/nvim-api-rs"

[workspace.dependencies]
mp = { version = "0.1.0", path = "crates/rmp-bytes", package = "rmp-bytes" }
nvim-api = { version = "0.1.0", path = "crates/nvim-api" }
nvim-api-sys = { version = "0.12.6", path = "crates/nvim-api-sys" }
