[workspace]
members = ["crates/*", "codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naughie/nvim-rpc-rs"

[workspace.dependencies]
mp = { version = "0.1.2", path = "crates/rmp-bytes", package = "rmp-bytes" }
nvim-rpc = { version = "0.1.3", path = "crates/nvim-rpc" }
nvim-rpc-sys = { version = "=0.12.6-r2", path = "crates/nvim-rpc-sys" }

futures = { version = "0.3", default-features = false }
futures-io = "0.3"
futures-util = { version = "0.3", default-features = false }
tokio = "1"
