[package]
name = "nvim-rpc-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tokio plugin handlers and a Neovim client with RPC response matching"
documentation = "https://docs.rs/nvim-rpc-plugin"
readme = "README.md"
keywords = ["neovim", "nvim", "plugin", "rpc", "tokio"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
nvim-rpc = { workspace = true, features = ["bytes", "tokio"] }
bytes = "1.11"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-std", "net", "process", "rt-multi-thread", "time"] }

