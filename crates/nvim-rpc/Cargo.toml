[package]
name = "nvim-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Neovim RPC calls with caller-selected arguments, results, and I/O"
documentation = "https://docs.rs/nvim-rpc"
readme = "README.md"
keywords = ["neovim", "nvim", "rpc", "msgpack"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[features]
bytes = ["mp/bytes"]

tokio = ["mp/tokio-write", "dep:tokio"]
futures = ["mp/futures-write", "dep:futures-io"]

[dependencies]
nvim-rpc-sys = { workspace = true }
mp = { workspace = true, features = ["rpc"] }

futures-io = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = [] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
