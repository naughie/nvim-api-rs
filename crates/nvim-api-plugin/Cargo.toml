[package]
name = "nvim-api-plugin"
version = "0.1.0"
edition = "2024"

[dependencies]
nvim-api = { workspace = true, features = ["bytes", "tokio"] }
bytes = "1.11"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-std", "net", "process", "rt-multi-thread", "time"] }

