[package]
name = "rmp-bytes"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MessagePack encoding and decoding with caller-selected buffers and I/O"
documentation = "https://docs.rs/rmp-bytes"
readme = "README.md"
keywords = ["msgpack", "messagepack", "encoding", "decoding", "rpc"]
categories = ["encoding"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []

bytes = ["dep:bytes"]

tokio-write = ["dep:tokio"]
futures-write = ["dep:futures-util"]

rpc = []

[dependencies]
bytes = { workspace = true, optional = true }
rmp = "0.8"

futures-util = { workspace = true, optional = true, features = ["io"] }
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
rmpv = "1.3"
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
